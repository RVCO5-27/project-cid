databases:
  - name: mysql
    plan: free       # use "starter" if you need more than free tier

services:
  - type: web
    name: backend
    env: node
    repo: https://github.com/RVCO5-27/project-cid
    branch: main
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      # Database connection – auto‑injected by Render from the linked MySQL service
      - key: DB_HOST
        fromDatabase:
          name: mysql
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mysql
          property: port
      - key: DB_USER
        fromDatabase:
          name: mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mysql
          property: password
      - key: DB_NAME
        fromDatabase:
          name: mysql
          property: database

      # Non‑sensitive runtime configuration
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DB_POOL_SIZE
        value: "20"
      - key: DB_SSL
        value: "false"
      - key: FRONTEND_ORIGIN
        value: "https://project-cid-nine.vercel.app,https://project-cid.onrender.com,http://localhost:5173,http://localhost,http://127.0.0.1"
      - key: LOG_LEVEL
        value: info

      # Secrets – MUST NOT be defined here. They will be set manually in the dashboard as SECRET vars.
      # No JWT_SECRET, GMAIL_USER, GMAIL_APP_PASSWORD, SMTP_FROM in this file.

static_sites:
  - name: frontend
    repo: https://github.com/RVCO5-27/project-cid
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    publishDir: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://project-cid.onrender.com/api
      - key: VITE_APP_NAME
        value: Project CID
      - key: VITE_ENV
        value: production